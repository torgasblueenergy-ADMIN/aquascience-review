                          <p className="text-xs sm:text-sm text-[#666666]">
                            {isEn ? (
                              <>
                                Please ensure your manuscript file is in <strong>PDF</strong> format (maximum <strong>5 MB</strong>) before uploading.
                              </>
                            ) : (
                              <>
                                Pastikan file naskah sudah dalam format <strong>PDF</strong> (maksimal <strong>5 MB</strong>) sebelum diunggah.
                              </>
                            )}
                          </p>
                        </div>

                        {formError && (
                          <div className="mb-6 p-4 bg-[#f2552c]/10 border border-[#f2552c] text-[#f2552c] text-xs sm:text-sm flex items-start gap-3">
                            <AlertCircleIcon className="w-5 h-5 shrink-0 mt-0.5" />
                            <span>{formError}</span>
                          </div>
                        )}

                        <form onSubmit={handleManuscriptSubmit} className="space-y-5 sm:space-y-6">
                          <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-[#353535] mb-2">{isEn ? "Selected Research Field *" : "Bidang Kajian Terpilih *"}</label>
                            <div className="w-full px-4 py-3 bg-[#f6f6f6] border border-[#004b8e]/30 text-sm font-bold text-[#004b8e] flex items-center justify-between gap-2 select-none">
                              <span>
                                {currentDomainLabel} — {displaySelectedField}
                              </span>
                              <span className="text-[10px] uppercase tracking-wider px-2 py-0.5 bg-[#004b8e] text-[#ffffff]">{isEn ? "Selected" : "Terpilih"}</span>
                            </div>
                          </div>

                          <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-[#353535] mb-2">{isEn ? "Author's Full Name & Academic Title *" : "Nama Lengkap & Gelar Penulis *"}</label>
                            <input
                              type="text"
                              disabled={isSubmitting}
                              value={authorName}
                              onChange={(e) => setAuthorName(e.target.value)}
                              placeholder={isEn ? "Example: Buntora Pasaribu, Ph.D." : "Contoh: Buntora Pasaribu, Ph.D."}
                              className="w-full px-4 py-3 bg-[#f9f9f9] border border-[#e1e1e1] focus:border-[#004b8e] focus:bg-[#ffffff] outline-none text-sm text-[#000000] disabled:opacity-60"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-[#353535] mb-2">{isEn ? "Institution / Affiliation" : "Institusi / Afiliasi"}</label>
                            <input
                              type="text"
                              disabled={isSubmitting}
                              value={affiliation}
                              onChange={(e) => setAffiliation(e.target.value)}
                              placeholder={isEn ? "University / Research Institution Name" : "Nama Universitas / Lembaga Riset"}
                              className="w-full px-4 py-3 bg-[#f9f9f9] border border-[#e1e1e1] focus:border-[#004b8e] focus:bg-[#ffffff] outline-none text-sm text-[#000000] disabled:opacity-60"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-[#353535] mb-2">{isEn ? "Full Manuscript Title *" : "Judul Lengkap Manuskrip *"}</label>
                            <input
                              type="text"
                              disabled={isSubmitting}
                              value={manuscriptTitle}
                              onChange={(e) => setManuscriptTitle(e.target.value)}
                              placeholder={isEn ? `Enter manuscript title for ${displaySelectedField.toLowerCase()}...` : `Masukkan judul manuskrip kajian ${selectedStudyField.toLowerCase()}...`}
                              className="w-full px-4 py-3 bg-[#f9f9f9] border border-[#e1e1e1] focus:border-[#004b8e] focus:bg-[#ffffff] outline-none text-sm text-[#000000] disabled:opacity-60"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-[#353535] mb-2">{isEn ? "Author Email (Review Recipient) *" : "Email Penulis (Penerima Hasil Review) *"}</label>
                            <input
                              type="email"
                              disabled={isSubmitting}
                              value={authorEmail}
                              onChange={(e) => setAuthorEmail(e.target.value)}
                              placeholder={isEn ? "example: author@institution.ac.id" : "contoh: penulis@institusi.ac.id"}
                              className="w-full px-4 py-3 bg-[#f9f9f9] border border-[#e1e1e1] focus:border-[#004b8e] focus:bg-[#ffffff] outline-none text-sm text-[#000000] disabled:opacity-60"
                            />
                            <p className="text-[11px] text-[#666666] mt-1.5">
                              {isEn ? "The reviewed PDF file and recommended journal list will be sent to this email address." : "File PDF hasil koreksi dan daftar jurnal rekomendasi akan dikirimkan ke alamat email ini."}
                            </p>
                          </div>

                          <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-[#353535] mb-2">
                              {isEn ? "Upload Manuscript Document (PDF Required, Max. 5 MB) *" : "Unggah Dokumen Manuskrip (Wajib PDF, Maks. 5 MB) *"}
                            </label>
                            <div
                              onClick={() => !isSubmitting && fileInputRef.current && fileInputRef.current.click()}
                              className={`border-2 border-dashed p-6 sm:p-8 text-center transition-colors ${isSubmitting ? "opacity-60 cursor-not-allowed" : "cursor-pointer"} ${
                                pdfFile ? "border-[#0693e3] bg-[#0693e3]/5" : "border-[#767676] bg-[#f9f9f9] hover:border-[#004b8e]"
                              }`}
                            >
                              <input ref={fileInputRef} type="file" accept=".pdf,application/pdf" disabled={isSubmitting} onChange={handlePdfSelect} className="hidden" />
                              <UploadIcon className="w-7 h-7 sm:w-8 sm:h-8 text-[#004b8e] mx-auto mb-3" />
                              {pdfFile ? (
                                <div>
                                  <p className="text-xs sm:text-sm font-bold text-[#004b8e] break-all">{pdfFile.name}</p>
                                  <p className="text-xs text-[#666666] mt-1">
                                    {(pdfFile.size / (1024 * 1024)).toFixed(2)} MB • {isEn ? "Ready to upload to Google Drive" : "Siap dikirim ke Google Drive"}
                                  </p>
                                </div>
                              ) : (
                                <div>
                                  <p className="text-xs sm:text-sm font-semibold text-[#000000]">{isEn ? "Click to select a PDF file from your device" : "Klik untuk memilih file PDF dari perangkat Anda"}</p>
                                  <p className="text-xs text-[#666666] mt-1">{isEn ? "Supports .pdf format only (maximum 5 MB)" : "Hanya mendukung format .pdf (maksimal 5 MB)"}</p>
                                </div>
                              )}
                            </div>
                          </div>

                          <button
                            type="submit"
                            disabled={isSubmitting}
                            className="w-full py-3.5 sm:py-4 font-display font-bold text-xs sm:text-sm uppercase tracking-wider transition-colors flex items-center justify-center gap-2 bg-[#0693e3] hover:bg-[#004b8e] disabled:bg-[#94a3b8] text-[#ffffff] cursor-pointer disabled:cursor-wait"
                          >
                            <SendIcon className="w-4 h-4" />
                            <span>{isSubmitting ? (isEn ? "Uploading PDF & Sending Notification..." : "Mengunggah PDF ke Drive & Mengirim Notifikasi...") : isEn ? "Submit Manuscript to Queue" : "Kirim Manuskrip ke Antrean"}</span>
                          </button>
                        </form>
                      </div>
                    </div>
                  </main>
                );
              })()}

            {/* =====================================================================
              VIEW 4: HALAMAN KHUSUS TRACKER (LIVE DATA DARI GOOGLE SHEETS)
             ===================================================================== */}
            {activeView === "tracker" &&
              (() => {
                const activeTrackerDomainCanonical = trackerDomain === "kelautan" ? "Ilmu Kelautan" : "Perikanan";
                const activeTrackerDomainLabel = translateDomain(activeTrackerDomainCanonical, lang);
                const studyCategories = SUB_DOMAIN_SHOWCASE[trackerDomain].items;

                const handleExecuteGlobalSearch = (e) => {
                  if (e) e.preventDefault();
                  if (!trackerSearchInput.trim()) {
                    setShowGlobalSearchResults(false);
                    return;
                  }
                  setShowGlobalSearchResults(true);
                  if (globalTrackerSearchResults.length === 1) {
                    handleSelectTrackedManuscript(globalTrackerSearchResults[0]);
                  }
                };

                return (
                  <main key="view-tracker" className="flex-1 bg-[#ffffff] animate-page-enter">
                    <div className="sticky top-16 sm:top-20 z-30 bg-[#004b8e] text-[#ffffff] border-b border-[#ffffff]/15 shadow-xs">
                      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 sm:py-3.5 flex items-center justify-between gap-4">
                        <div>
                          <div className="flex items-center gap-1.5 text-[11px] font-semibold text-[#dfdfdf] mb-0.5">
                            <button type="button" onClick={() => handleNavigate("home")} className="hover:text-[#ffffff] underline cursor-pointer">
                              {isEn ? "Home" : "Beranda"}
                            </button>
                            <span className="text-[#dfdfdf]/60">/</span>
                            <span className="text-[#38bdf8] font-bold">{isEn ? "Queue Tracker" : "Tracker Antrean"}</span>
                          </div>
                          <h1 className="font-display text-lg sm:text-xl lg:text-2xl font-bold text-[#ffffff] tracking-tight leading-tight">
                            {isEn ? (
                              <>
                                Manuscript <span className="text-[#38bdf8]">Queue Tracker</span>
                              </>
                            ) : (
                              <>
                                Tracker <span className="text-[#38bdf8]">Antrean Manuskrip</span>
                              </>
                            )}
                          </h1>
                        </div>

                        <button
                          type="button"
                          onClick={() => handleNavigate("home")}
                          className="inline-flex items-center gap-1.5 px-3.5 py-2 bg-[#0693e3] hover:bg-[#ffffff] text-[#ffffff] hover:text-[#004b8e] text-xs font-display font-bold uppercase tracking-wider transition-colors shrink-0 cursor-pointer"
                        >
                          <span>←</span>
                          <span>{isEn ? "Back" : "Kembali"}</span>
                        </button>
                      </div>
                    </div>

                    <div className="bg-[#ffffff] border-b border-[#e1e1e1]">
                      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col items-center justify-center gap-3">
                        <div className="inline-flex bg-[#f6f6f6] border border-[#e1e1e1] p-1">
                          <button
                            type="button"
                            onClick={() => {
                              setTrackerDomain("kelautan");
                              setSelectedTrackerField(null);
                              setSelectedTrackerId(null);
                            }}
                            className={`px-5 sm:px-7 py-2 text-xs sm:text-sm font-display font-bold uppercase tracking-wider flex items-center gap-2 transition-colors cursor-pointer ${
                              trackerDomain === "kelautan" ? "bg-[#004b8e] text-[#ffffff]" : "text-[#666666] hover:text-[#000000]"
                            }`}
                          >
                            <WavesIcon className="w-4 h-4" />
                            <span>{isEn ? "Marine Science" : "Ilmu Kelautan"}</span>
                          </button>

                          <button
                            type="button"
                            onClick={() => {
                              setTrackerDomain("perikanan");
                              setSelectedTrackerField(null);
                              setSelectedTrackerId(null);
                            }}
                            className={`px-5 sm:px-7 py-2 text-xs sm:text-sm font-display font-bold uppercase tracking-wider flex items-center gap-2 transition-colors cursor-pointer ${
                              trackerDomain === "perikanan" ? "bg-[#004b8e] text-[#ffffff]" : "text-[#666666] hover:text-[#000000]"
                            }`}
                          >
                            <FishIcon className="w-4 h-4" />
                            <span>{isEn ? "Fisheries" : "Perikanan"}</span>
                          </button>
                        </div>

                        <form onSubmit={handleExecuteGlobalSearch} className="w-full max-w-2xl relative">
                          <div className="flex items-stretch gap-2">
                            <input
                              type="text"
                              value={trackerSearchInput}
                              onChange={(e) => {
                                setTrackerSearchInput(e.target.value);
                                setShowGlobalSearchResults(e.target.value.trim().length > 0);
                              }}
                              placeholder={isEn ? "Search code (AQM-2026-1101), author name, research field, or department..." : "Cari kode (AQM-2026-1101), nama penulis, bidang kajian, atau jurusan..."}
                              className="flex-1 min-w-0 px-3.5 py-2.5 bg-[#f9f9f9] border border-[#e1e1e1] focus:border-[#004b8e] focus:bg-[#ffffff] outline-none text-xs sm:text-sm text-[#000000]"
                            />
                            <button
                              type="submit"
                              className="px-4 sm:px-5 py-2.5 bg-[#0693e3] hover:bg-[#004b8e] text-[#ffffff] text-xs font-display font-bold uppercase tracking-wider flex items-center gap-1.5 shrink-0 transition-colors cursor-pointer"
                            >
                              <SearchIcon className="w-4 h-4" />
                              <span>{isEn ? "Search" : "Cari"}</span>
                            </button>
                          </div>

                          {showGlobalSearchResults && trackerSearchInput.trim() !== "" && (
                            <div className="mt-2 bg-[#ffffff] border border-[#004b8e] shadow-lg p-3 space-y-2">
                              <div className="flex items-center justify-between text-[11px] font-bold text-[#666666] pb-1.5 border-b border-[#e1e1e1]">
                                <span>{isEn ? `Search Results Across All Departments & Categories (${globalTrackerSearchResults.length})` : `Hasil Pencarian Semua Jurusan & Kategori (${globalTrackerSearchResults.length})`}</span>
                                <button type="button" onClick={() => setShowGlobalSearchResults(false)} className="text-[#f2552c] hover:underline cursor-pointer">
                                  {isEn ? "Close ✕" : "Tutup ✕"}
                                </button>
                              </div>

                              {globalTrackerSearchResults.length === 0 ? (
                                <p className="text-xs text-[#666666] py-2">{isEn ? "No matching manuscripts found across all departments and categories." : "Tidak ditemukan manuskrip yang cocok di seluruh jurusan dan kategori."}</p>
                              ) : (
                                <div className="max-h-56 overflow-y-auto space-y-1.5 pr-1">
                                  {globalTrackerSearchResults.map((item) => {
                                    const queueIdx = activeQueueList.findIndex((q) => q.id === item.id);
                                    return (
                                      <button
                                        key={item.id}
                                        type="button"
                                        onClick={() => handleSelectTrackedManuscript(item)}
                                        className="w-full text-left p-2.5 bg-[#f9f9f9] hover:bg-[#004b8e] text-[#000000] hover:text-[#ffffff] border border-[#e1e1e1] transition-colors flex items-center justify-between gap-2 cursor-pointer group"
                                      >
                                        <div className="min-w-0">
                                          <div className="flex flex-wrap items-center gap-1.5 text-[10px] font-bold">
                                            <span className="text-[#004b8e] group-hover:text-[#38bdf8]">
                                              {queueIdx !== -1 ? (isEn ? `Queue #${queueIdx + 1}` : `Antrean #${queueIdx + 1}`) : isEn ? "Completed" : "Selesai"} • {item.id}
                                            </span>
                                            <span className="px-1.5 py-0.5 bg-[#ffffff] group-hover:bg-[#ffffff]/15 text-[#333333] group-hover:text-[#ffffff]">
                                              {translateDomain(item.domain, lang)} — {translateField(item.studyField, lang)}
                                            </span>
                                          </div>
                                          <p className="font-display font-bold text-xs sm:text-sm truncate mt-0.5">{item.authorName}</p>
                                        </div>
                                        <span className="text-[10px] font-bold px-2 py-0.5 bg-[#0693e3]/15 text-[#004b8e] group-hover:bg-[#0693e3] group-hover:text-[#ffffff] shrink-0">{translateStatus(item.status, lang)}</span>
                                      </button>
                                    );
                                  })}
                                </div>
                              )}
                            </div>
                          )}
                        </form>
                      </div>
                    </div>

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
                      <div className="lg:col-span-5 space-y-3">
                        <div className="bg-[#004b8e] text-[#ffffff] border border-[#004b8e] p-4 sm:p-6 shadow-sm">
                          <div className="flex items-center justify-between gap-2 mb-2">
                            <h2 className="font-display text-base sm:text-lg font-bold text-[#ffffff]">{isEn ? `${activeTrackerDomainLabel} Research Fields` : `Bidang Kajian ${activeTrackerDomainLabel}`}</h2>
                            <span className="px-2.5 py-0.5 bg-[#0693e3] text-[#ffffff] text-[11px] font-bold">{isLoadingData ? (isEn ? "Syncing..." : "Memuat...") : `${studyCategories.length} ${isEn ? "Categories" : "Kategori"}`}</span>
                          </div>
                          <p className="text-xs text-[#dfdfdf] mb-4">
                            {isEn ? "Select a research field category below to view the manuscripts grouped within it." : "Pilih kategori bidang kajian di bawah untuk melihat daftar manuskrip yang dikelompokkan di dalamnya."}
                          </p>

                          <div className="space-y-2.5">
                            {studyCategories.map((category, idx) => {
                              const isCategoryOpen = selectedTrackerField === category.title;
                              const displayCatTitle = isEn && category.titleEn ? category.titleEn : category.title;
                              const groupedManuscripts = manuscripts.filter((m) => m.domain === activeTrackerDomainCanonical && (m.studyField || "").toLowerCase() === category.title.toLowerCase());

                              return (
                                <div key={category.id} className="border border-[#ffffff]/20 overflow-hidden">
                                  <button
                                    type="button"
                                    onClick={() => {
                                      setSelectedTrackerField(isCategoryOpen ? null : category.title);
                                      setSelectedTrackerId(null);
                                    }}
                                    className={`w-full text-left p-3.5 transition-colors flex items-center justify-between gap-3 cursor-pointer ${
                                      isCategoryOpen ? "bg-[#0693e3] text-[#ffffff]" : "bg-[#ffffff]/10 hover:bg-[#ffffff]/18 text-[#ffffff]"
                                    }`}
                                  >
                                    <div className="min-w-0">
                                      <span className={`text-[10px] font-display font-bold uppercase tracking-widest block ${isCategoryOpen ? "text-[#ffffff]/90" : "text-[#38bdf8]"}`}>
                                        0{idx + 1} • {activeTrackerDomainLabel}
                                      </span>
                                      <span className="font-display font-bold text-sm sm:text-base block truncate">{displayCatTitle}</span>
                                    </div>

                                    <div className="flex items-center gap-2 shrink-0">
                                      <span className={`px-2 py-0.5 text-[11px] font-bold ${isCategoryOpen ? "bg-[#004b8e] text-[#ffffff]" : "bg-[#ffffff]/15 text-[#ffffff] border border-[#ffffff]/25"}`}>
                                        {isLoadingData ? "..." : groupedManuscripts.length} {isEn ? "Papers" : "Naskah"}
                                      </span>
                                      <span className="text-xs font-bold">{isCategoryOpen ? "▲" : "▼"}</span>
                                    </div>
                                  </button>

                                  {isCategoryOpen && (
                                    <div className="p-3.5 bg-[#ffffff] text-[#333333] border-t border-[#e1e1e1] space-y-2">
                                      {groupedManuscripts.length === 0 ? (
                                        <p className="text-xs text-[#666666] py-2 px-1">{isEn ? `No manuscripts submitted yet under ${displayCatTitle}.` : `Belum ada manuskrip pada bidang kajian ${category.title}.`}</p>
                                      ) : (
                                        groupedManuscripts.map((item) => {
                                          const queueIdx = activeQueueList.findIndex((q) => q.id === item.id);
                                          const isItemSelected = selectedTrackerId === item.id;
                                          return (
                                            <button
                                              key={item.id}
                                              type="button"
                                              onClick={() => setSelectedTrackerId(item.id)}
                                              className={`w-full text-left p-3 border transition-all flex items-center justify-between gap-2 cursor-pointer ${
                                                isItemSelected ? "bg-[#004b8e] text-[#ffffff] border-[#004b8e]" : "bg-[#f9f9f9] hover:bg-[#f0f7ff] text-[#000000] border-[#e1e1e1] hover:border-[#004b8e]"
                                              }`}
                                            >
                                              <div className="min-w-0">
                                                <span className={`text-[10px] font-bold block ${isItemSelected ? "text-[#38bdf8]" : "text-[#004b8e]"}`}>
                                                  {queueIdx !== -1 ? (isEn ? `Queue #${queueIdx + 1}` : `Antrean #${queueIdx + 1}`) : isEn ? "Completed" : "Selesai"} • {item.id}
                                                </span>
                                                <p className="font-display font-bold text-xs sm:text-sm truncate">{item.authorName}</p>
                                              </div>

                                              <span
                                                className={`px-2 py-0.5 text-[10px] font-bold shrink-0 ${
                                                  item.status === "Selesai"
                                                    ? isItemSelected
                                                      ? "bg-[#0693e3] text-[#ffffff]"
                                                      : "bg-[#0693e3]/15 text-[#004b8e]"
                                                    : isItemSelected
                                                      ? "bg-[#ffffff]/20 text-[#ffffff]"
                                                      : "bg-[#f2552c]/15 text-[#f2552c]"
                                                }`}
                                              >
                                                {translateStatus(item.status, lang)}
                                              </span>
                                            </button>
                                          );
                                        })
                                      )}
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      </div>

                      <div className="lg:col-span-7">
                        {!trackedManuscript ? (
                          <div className="bg-[#f9f9f9] border border-dashed border-[#767676] p-8 sm:p-12 text-center">
                            <div className="w-12 h-12 bg-[#004b8e]/10 text-[#004b8e] flex items-center justify-center mx-auto mb-3">
                              <SearchIcon className="w-6 h-6" />
                            </div>
                            <h2 className="font-display text-lg sm:text-xl font-bold text-[#000000] mb-1.5">{isEn ? "Manuscript Progress Details" : "Detail Progres Manuskrip"}</h2>
                            <p className="text-xs sm:text-sm text-[#666666] max-w-md mx-auto">
                              {isEn ? (
                                <>
                                  Click any <strong>Research Field</strong> on the left and select an author's name (or use the search bar above) to display review progress details.
                                </>
                              ) : (
                                <>
                                  Klik salah satu <strong>Bidang Kajian</strong> di sebelah kiri lalu pilih nama penulis manuskrip (atau gunakan kolom pencarian di atas) untuk menampilkan detail progres review.
                                </>
                              )}
                            </p>
                          </div>
                        ) : (
                          <div className="bg-[#f9f9f9] border border-[#e1e1e1] p-5 sm:p-8 animate-page-enter">
                            <div className="flex items-center justify-between gap-2 mb-4">
                              <h2 className="font-display text-lg sm:text-xl font-bold text-[#000000]">{isEn ? "Manuscript Progress Details" : "Detail Progres Manuskrip"}</h2>
                              <button type="button" onClick={() => setSelectedTrackerId(null)} className="text-xs font-semibold text-[#666666] hover:text-[#f2552c] cursor-pointer">
                                {isEn ? "Close Details ✕" : "Tutup Detail ✕"}
                              </button>
                            </div>

                            <div className="bg-[#ffffff] border border-[#e1e1e1] p-5 sm:p-7 space-y-6">
                              <div className="pb-5 border-b border-[#e1e1e1]">
                                <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                                  <span className="text-xs font-bold px-3 py-1 bg-[#004b8e] text-[#ffffff]">{trackedManuscript.id}</span>
                                  <span className="text-xs font-semibold text-[#666666]">
                                    {translateDomain(trackedManuscript.domain, lang)} {trackedManuscript.studyField ? `(${translateField(trackedManuscript.studyField, lang)})` : ""} •{" "}
                                    {isEn ? `Submitted ${trackedManuscript.date}` : `Masuk ${trackedManuscript.date}`}
                                  </span>
                                </div>

                                <p className="text-xs uppercase tracking-wider text-[#666666] mt-3">{isEn ? "Author Name" : "Nama Penulis"}</p>
                                <h3 className="font-display font-bold text-xl sm:text-2xl text-[#000000] leading-snug break-words">{trackedManuscript.authorName}</h3>

                                {trackedQueuePosition !== null && (
                                  <div className="mt-3 inline-flex items-center gap-2 px-3 py-1.5 bg-[#f6f6f6] border border-[#e1e1e1] text-xs font-semibold text-[#004b8e]">
                                    <ClockIcon className="w-4 h-4 text-[#0693e3] shrink-0" />
                                    <span>{isEn ? `Current Queue Position: #${trackedQueuePosition} in line` : `Posisi Antrean Saat Ini: Urutan ke-${trackedQueuePosition}`}</span>
                                  </div>
                                )}
                              </div>

                              <div>
                                <div className="flex justify-between text-xs font-bold mb-2">
                                  <span className="text-[#004b8e]">{isEn ? `Stage ${trackedManuscript.progressStep} of 4` : `Tahap ${trackedManuscript.progressStep} dari 4`}</span>
                                  <span className="text-[#0693e3]">{trackedManuscript.progressStep * 25}%</span>
                                </div>
                                <div className="w-full h-3 bg-[#e1e1e1] overflow-hidden mb-5">
                                  <div
                                    className="h-full bg-[#0693e3] transition-all duration-500"
                                    style={{
                                      width: `${trackedManuscript.progressStep * 25}%`,
                                    }}
                                  />
                                </div>

                                <ol className="space-y-3 text-xs sm:text-sm">
                                  {[
                                    { step: 1, label: isEn ? "PDF Uploaded to Database" : "PDF Telah Masuk Ke Database" },
                                    { step: 2, label: isEn ? "Team Notified & Added to Review Queue" : "Email Notifikasi Tim & Masuk Daftar Antrean" },
                                    { step: 3, label: isEn ? "Peer Review Process in Progress" : "Proses Telaah Sedang Dilakukan" },
                                    { step: 4, label: isEn ? "Revised File & Journal Recommendations Sent via Email" : "File Koreksi & Rekomendasi Jurnal Terkirim via Email" },
                                  ].map((s) => {
                                    const done = trackedManuscript.progressStep >= s.step;
                                    return (
                                      <li key={s.step} className={`flex items-start gap-3 ${done ? "text-[#000000] font-semibold" : "text-[#666666]"}`}>
                                        <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[11px] shrink-0 mt-0.5 ${done ? "bg-[#0693e3] text-[#ffffff]" : "bg-[#e1e1e1] text-[#666666]"}`}>
                                          {done ? "✓" : s.step}
                                        </span>
                                        <span>{s.label}</span>
                                      </li>
                                    );
                                  })}
                                </ol>
                              </div>

                              {trackedManuscript.status === "Selesai" && (
                                <div className="pt-5 border-t border-[#e1e1e1] space-y-5">
                                  <div className="bg-[#f6f6f6] p-4 border-l-4 border-[#0693e3]">
                                    <p className="text-xs font-bold text-[#004b8e] mb-1">{isEn ? "Reviewer Summary Notes:" : "Catatan Ringkas Reviewer:"}</p>
                                    <p className="text-xs sm:text-sm text-[#333333] leading-relaxed">{trackedManuscript.reviewNotes}</p>
                                  </div>

                                  {Array.isArray(trackedManuscript.recommendedJournals) && trackedManuscript.recommendedJournals.length > 0 && (
                                    <div>
                                      <p className="text-xs font-bold uppercase tracking-wider text-[#000000] mb-3">
                                        {isEn ? `Recommended Journal Websites (${trackedManuscript.recommendedJournals.length})` : `Daftar Website Jurnal Rekomendasi (${trackedManuscript.recommendedJournals.length})`}
                                      </p>
                                      <div className="space-y-2.5">
                                        {trackedManuscript.recommendedJournals.map((j, idx) => (
                                          <a
                                            key={idx}
                                            href={j.url}
                                            target="_blank"
                                            rel="noreferrer"
                                            className="block p-3.5 bg-[#f9f9f9] hover:bg-[#004b8e] text-[#000000] hover:text-[#ffffff] border border-[#e1e1e1] transition-colors group"
                                          >
                                            <div className="flex items-center justify-between gap-2">
                                              <span className="font-bold text-xs sm:text-sm">{j.name}</span>
                                              <ExternalLinkIcon className="w-4 h-4 text-[#0693e3] group-hover:text-[#ffffff] shrink-0" />
                                            </div>
                                            <span className="text-xs text-[#0693e3] group-hover:text-[#dfdfdf] font-semibold block mt-0.5">{j.index}</span>
                                            {j.reason && <p className="text-xs text-[#666666] group-hover:text-[#dfdfdf] mt-1">{j.reason}</p>}
                                          </a>
                                        ))}
                                      </div>
                                    </div>
                                  )}
                                </div>
                              )}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </main>
                );
              })()}

            {/* =====================================================================
              VIEW 5: PORTAL LOGIN REVIEWER & ADMIN BESAR (ZERO-LEAK SERVER AUTH)
             ===================================================================== */}
            {activeView === "login" && (
              <main
                key="view-login"
                className="relative flex-1 min-h-[calc(100vh-4rem)] sm:min-h-[calc(100vh-5rem)] min-h-[calc(100dvh-4rem)] sm:min-h-[calc(100dvh-5rem)] bg-neutral-900 flex flex-col items-center justify-center px-4 sm:px-6 py-10 sm:py-14 overflow-hidden animate-page-enter"
              >
                <div className="absolute inset-0 z-0 pointer-events-none select-none">
                  {HERO_SLIDE_IMAGES.map((slide, index) => {
                    const isActive = index === currentSlide;
                    return (
                      <img
                        key={index}
                        src={slide.src}
                        alt={slide.alt}
                        onError={(e) => {
                          if (slide.fallbackUrl && e.currentTarget.src !== slide.fallbackUrl) {
                            e.currentTarget.src = slide.fallbackUrl;
                          }
                        }}
                        className={`absolute inset-0 w-full h-full object-cover object-center transition-all duration-[1200ms] ease-in-out ${isActive ? "opacity-100 scale-100" : "opacity-0 scale-105"}`}
                      />
                    );
                  })}
                  <div className="absolute inset-0 bg-black/20" />
                </div>

                <div className="relative z-10 max-w-md w-full bg-[#ffffff]/85 backdrop-blur-md border border-[#ffffff]/70 p-6 sm:p-10 shadow-2xl">
                  <div className="w-12 h-12 bg-[#004b8e] text-[#ffffff] flex items-center justify-center mb-6 shadow-sm">
                    <ShieldCheckIcon className="w-6 h-6" />
                  </div>
                  <h1 className="font-display text-2xl sm:text-3xl font-bold text-[#000000] mb-2">{isEn ? "Reviewer & Admin Portal" : "Portal Reviewer & Admin"}</h1>
                  <p className="text-xs text-[#444444] mb-6 leading-relaxed">
                    {isEn ? "Sign in using your registered institutional email and access PIN to manage and evaluate manuscripts." : "Masuk menggunakan email terdaftar dan PIN akses resmi untuk menelaah manuskrip pada bidang kajian Anda."}
                  </p>

                  {loginError && <div className="mb-5 p-3.5 bg-[#f2552c]/15 backdrop-blur-xs border border-[#f2552c] text-[#b91c1c] text-xs font-semibold">{loginError}</div>}

                  <form onSubmit={handleReviewerLogin} className="space-y-5">
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-[#222222] mb-2">{isEn ? "Registered Account Email" : "Email Terdaftar"}</label>
                      <input
                        type="email"
                        required
                        disabled={isLoggingIn}
                        value={loginEmail}
                        onChange={(e) => setLoginEmail(e.target.value)}
                        placeholder={isEn ? "name@institution.ac.id" : "nama@institusi.ac.id"}
                        className="w-full px-4 py-3 bg-[#ffffff]/80 border border-[#cccccc]/80 focus:border-[#004b8e] focus:bg-[#ffffff] outline-none text-sm text-[#000000] transition-colors disabled:opacity-60"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-[#222222] mb-2">{isEn ? "PIN / Access Code" : "PIN / Kode Akses"}</label>
                      <input
                        type="password"
                        required
                        disabled={isLoggingIn}
                        value={loginPin}
                        onChange={(e) => setLoginPin(e.target.value)}
                        placeholder="•••••••"
                        className="w-full px-4 py-3 bg-[#ffffff]/80 border border-[#cccccc]/80 focus:border-[#004b8e] focus:bg-[#ffffff] outline-none text-sm text-[#000000] transition-colors disabled:opacity-60"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={isLoggingIn}
                      className="w-full py-3.5 bg-[#004b8e] hover:bg-[#0693e3] disabled:bg-[#64748b] text-[#ffffff] font-display font-bold text-xs sm:text-sm uppercase tracking-wider transition-colors shadow-md cursor-pointer disabled:cursor-wait"
                    >
                      {isLoggingIn ? (isEn ? "Verifying Credentials..." : "Memverifikasi Akun...") : isEn ? "Sign In to Dashboard" : "Masuk ke Dashboard"}
                    </button>
                  </form>
                </div>

                <div className="relative z-10 mt-6 flex items-center gap-2 bg-black/35 backdrop-blur-xs px-3 py-1.5 border border-[#ffffff]/25">
                  {HERO_SLIDE_IMAGES.map((_, idx) => {
                    const isCurrent = idx === currentSlide;
                    return (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => setCurrentSlide(idx)}
                        aria-label={isEn ? `Show slide ${idx + 1}` : `Tampilkan slide ${idx + 1}`}
                        className={`h-1.5 transition-all duration-500 cursor-pointer ${isCurrent ? "w-7 bg-[#38bdf8]" : "w-3 bg-[#ffffff]/60 hover:bg-[#ffffff]"}`}
                      />
                    );
                  })}
                </div>
              </main>
            )}

            {/* =====================================================================
              VIEW 6: DASHBOARD REVIEWER & ADMIN BESAR (LIVE GOOGLE DRIVE & GMAIL)
             ===================================================================== */}
            {activeView === "dashboard" &&
              loggedReviewer &&
              (() => {
                const isSuperAdmin = loggedReviewer.role === "admin";
                const availableStudyFields = isSuperAdmin
                  ? [...SUB_DOMAIN_SHOWCASE.kelautan.items.map((i) => i.title), ...SUB_DOMAIN_SHOWCASE.perikanan.items.map((i) => i.title)]
                  : SUB_DOMAIN_SHOWCASE[loggedReviewer.specialty === "Ilmu Kelautan" ? "kelautan" : "perikanan"].items.map((i) => i.title);

                return (
                  <main key="view-dashboard" className="flex-1 bg-gradient-to-b from-[#002f5c] via-[#003f7a] to-[#004b8e] text-[#ffffff] animate-page-enter">
                    <div className="sticky top-16 sm:top-20 z-30 bg-[#00284d]/95 backdrop-blur-md text-[#ffffff] border-b border-[#ffffff]/15 shadow-md">
                      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                          <div className="flex flex-wrap items-center gap-2 mb-1">
                            <span className="text-xs uppercase tracking-widest text-[#dfdfdf]/85">
                              {isSuperAdmin ? (isEn ? "Active Super Admin Portal" : "Portal Admin Besar Aktif") : isEn ? "Active Reviewer Portal" : "Portal Reviewer Aktif"}
                            </span>
                            <span className={`px-2.5 py-0.5 text-[10px] font-display font-bold uppercase tracking-wider ${isSuperAdmin ? "bg-[#f2552c] text-[#ffffff]" : "bg-[#0693e3] text-[#ffffff]"}`}>
                              {isSuperAdmin
                                ? isEn
                                  ? "Super Admin • All Fields"
                                  : "Admin Besar • Semua Bidang"
                                : isEn
                                  ? `${translateDomain(loggedReviewer.specialty, lang)} Field • ${translateField(loggedReviewer.expertise, lang)}`
                                  : `Bidang ${loggedReviewer.specialty} • ${loggedReviewer.expertise}`}
                            </span>
                          </div>
                          <h1 className="font-display text-xl sm:text-3xl font-bold">{loggedReviewer.name}</h1>
                        </div>

                        <button
                          onClick={() => {
                            setLoggedReviewer(null);
                            setSelectedReviewId(null);
                            fetchPublicManuscripts();
                            handleNavigate("home");
                          }}
                          className="px-4 py-2.5 bg-[#ffffff]/12 hover:bg-[#f2552c] text-[#ffffff] border border-[#ffffff]/25 text-xs font-bold uppercase tracking-wider flex items-center gap-2 self-start cursor-pointer transition-colors"
                        >
                          <LogOutIcon className="w-4 h-4" />
                          <span>{isEn ? "Logout" : "Keluar"}</span>
                        </button>
                      </div>
                    </div>

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
                      {/* KOLOM KIRI: Daftar Antrean Manuskrip */}
                      <div className="lg:col-span-5 space-y-4">
                        <div className="bg-[#00284d]/70 border border-[#ffffff]/20 p-4 sm:p-5 space-y-3">
                          <div className="flex flex-wrap items-center justify-between gap-2">
                            <h2 className="font-display text-lg sm:text-xl font-bold text-[#ffffff]">{isEn ? `Manuscript Queue (${filteredDashboardManuscripts.length})` : `Antrean Manuskrip (${filteredDashboardManuscripts.length})`}</h2>

                            {!isSuperAdmin && <span className="px-2.5 py-1 bg-[#0693e3] text-[#ffffff] text-[11px] font-display font-bold uppercase tracking-wider">{translateField(loggedReviewer.expertise, lang)}</span>}
                          </div>

                          <div className="flex flex-wrap items-center gap-1.5">
                            {(isSuperAdmin ? ["Semua", "Menunggu", "Ilmu Kelautan", "Perikanan"] : ["Semua", "Menunggu"]).map((tab) => {
                              const tabLabel = tab === "Semua" ? (isEn ? "All" : "Semua") : tab === "Menunggu" ? (isEn ? "Pending" : "Menunggu") : translateDomain(tab, lang);
                              return (
                                <button
                                  key={tab}
                                  type="button"
                                  onClick={() => setDashboardFilter(tab)}
                                  className={`px-3 py-1.5 text-xs font-bold border transition-colors cursor-pointer ${
                                    dashboardFilter === tab ? "bg-[#38bdf8] text-[#00284d] border-[#38bdf8]" : "bg-[#ffffff]/10 text-[#ffffff] border-[#ffffff]/25 hover:bg-[#ffffff]/20"
                                  }`}
                                >
                                  {tabLabel}
                                </button>
                              );
                            })}

                            {isSuperAdmin && (
                              <select
                                value={dashboardStudyFieldFilter}
                                onChange={(e) => setDashboardStudyFieldFilter(e.target.value)}
                                aria-label={isEn ? "Filter Research Field" : "Filter Bidang Kajian"}
                                className="px-2.5 py-1.5 bg-[#ffffff] text-[#00284d] border border-[#ffffff] text-xs font-bold outline-none cursor-pointer"
                              >
                                <option value="Semua Kajian">{isEn ? "Research Field: All" : "Bidang Kajian: Semua"}</option>
                                {availableStudyFields.map((field) => (
                                  <option key={field} value={field}>
                                    {isEn ? `Field: ${translateField(field, lang)}` : `Kajian: ${field}`}
                                  </option>
                                ))}
                              </select>
                            )}
                          </div>
                        </div>

                        <div className="space-y-3">
                          {filteredDashboardManuscripts.length === 0 ? (
                            <div className="bg-[#ffffff]/10 border border-[#ffffff]/20 p-6 text-center text-xs sm:text-sm text-[#e2e8f0]">
                              {isEn ? "No manuscripts found for this research field filter." : "Belum ada manuskrip pada filter bidang kajian ini."}
                            </div>
                          ) : (
                            filteredDashboardManuscripts.map((item) => {
                              const isSelected = activeReviewManuscript && activeReviewManuscript.id === item.id;
                              return (
                                <div
                                  key={item.id}
                                  onClick={() => {
                                    setSelectedReviewId(item.id);
                                    setReviewSuccessBanner("");
                                    setReviewErrorBanner("");
                                  }}
                                  className={`p-4 sm:p-5 border transition-all cursor-pointer shadow-md ${
                                    isSelected ? "bg-[#ffffff] border-2 border-[#38bdf8] ring-2 ring-[#38bdf8]/40" : "bg-[#ffffff]/95 hover:bg-[#ffffff] border-[#ffffff]/30"
                                  }`}
                                >
                                  <div className="flex items-center justify-between gap-2 mb-2">
                                    <span className="text-xs font-bold text-[#004b8e]">
                                      {item.id} • {translateDomain(item.domain, lang)} {item.studyField ? `(${translateField(item.studyField, lang)})` : ""}
                                    </span>
                                    <span className={`px-2.5 py-0.5 text-[11px] font-bold ${item.status === "Selesai" ? "bg-[#0693e3]/15 text-[#004b8e]" : "bg-[#f2552c]/15 text-[#f2552c]"}`}>{translateStatus(item.status, lang)}</span>
                                  </div>

                                  <h3 className="font-display font-bold text-sm text-[#000000] line-clamp-2 mb-2">{item.title}</h3>
                                  <div className="flex items-center justify-between text-xs text-[#666666] gap-2">
                                    <span className="truncate font-medium text-[#333333]">{item.authorName}</span>
                                    <span className="shrink-0">{item.date}</span>
                                  </div>
                                  <p className="text-[11px] text-[#0693e3] font-medium truncate mt-1">{item.authorEmail}</p>
                                </div>
                              );
                            })
                          )}
                        </div>
                      </div>

                      {/* KOLOM KANAN: Lembar Kerja Reviewer */}
                      <div className="lg:col-span-7">
                        {!activeReviewManuscript ? (
                          <div className="bg-[#ffffff]/10 border border-[#ffffff]/25 p-8 text-center text-sm text-[#e2e8f0]">
                            {isEn ? "No manuscripts available to display in this field." : "Tidak ada manuskrip yang tersedia untuk ditampilkan pada bidang ini."}
                          </div>
                        ) : (
                          <div className="bg-[#ffffff] text-[#333333] border border-[#ffffff]/40 p-5 sm:p-8 space-y-6 shadow-xl">
                            {reviewSuccessBanner && (
                              <div className="p-4 bg-[#004b8e] text-[#ffffff] text-xs sm:text-sm flex items-start gap-3">
                                <CheckCircleIcon className="w-5 h-5 text-[#38bdf8] shrink-0 mt-0.5" />
                                <span>{reviewSuccessBanner}</span>
                              </div>
                            )}

                            {reviewErrorBanner && (
                              <div className="p-4 bg-[#f2552c]/10 border border-[#f2552c] text-[#b91c1c] text-xs sm:text-sm flex items-start gap-3">
                                <AlertCircleIcon className="w-5 h-5 shrink-0 mt-0.5" />
                                <span>{reviewErrorBanner}</span>
                              </div>
                            )}

                            <div className="pb-6 border-b border-[#e1e1e1]">
                              <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                                <span className="text-xs font-bold uppercase tracking-wider text-[#0693e3]">
                                  {isEn ? "Manuscript Review Worksheet" : "Lembar Kerja Review Manuscript"} {activeReviewManuscript.id}{" "}
                                  {activeReviewManuscript.studyField ? `• ${translateField(activeReviewManuscript.studyField, lang)}` : ""}
                                </span>

                                {activeReviewManuscript.status === "Dalam Antrean" && (
                                  <button
                                    type="button"
                                    disabled={isStartingReview}
                                    onClick={() => handleStartReview(activeReviewManuscript.id)}
                                    className="px-3 py-1 bg-[#f2552c] hover:bg-[#004b8e] text-[#ffffff] text-[11px] font-display font-bold uppercase tracking-wider transition-colors cursor-pointer disabled:opacity-60"
                                  >
                                    {isStartingReview ? (isEn ? "Updating..." : "Memperbarui...") : isEn ? "Start Review (Mark Under Review)" : "Mulai Telaah (Tandai Sedang Direview)"}
                                  </button>
                                )}
                              </div>
                              <h2 className="font-display text-lg sm:text-2xl font-bold text-[#000000] mb-3">{activeReviewManuscript.title}</h2>
                              <p className="text-xs text-[#666666] mb-4 break-words">
                                {isEn ? "Author:" : "Penulis:"} <strong>{activeReviewManuscript.authorName}</strong> ({activeReviewManuscript.authorEmail}) — {activeReviewManuscript.affiliation}
                              </p>

                              {/* Kotak File Asli Penulis di Google Drive */}
                              <div className="p-4 bg-[#f0f6fc] border border-[#004b8e]/20 flex flex-wrap items-center justify-between gap-3">
                                <div className="flex items-center gap-3 min-w-0">
                                  <FileTextIcon className="w-5 h-5 text-[#004b8e] shrink-0" />
                                  <div className="min-w-0">
                                    <p className="text-xs font-bold text-[#000000] truncate">{activeReviewManuscript.originalFileName}</p>
                                    <p className="text-[11px] text-[#666666]">{isEn ? "Original document stored in Google Drive" : "Dokumen asli tersimpan di Google Drive"}</p>
                                  </div>
                                </div>
                                {activeReviewManuscript.originalFileUrl ? (
                                  <a
                                    href={activeReviewManuscript.originalFileUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="px-3.5 py-2 bg-[#004b8e] hover:bg-[#0693e3] text-[#ffffff] text-xs font-bold flex items-center gap-1.5 cursor-pointer transition-colors shrink-0"
                                  >
                                    <DownloadIcon className="w-3.5 h-3.5" />
                                    <span>{isEn ? "Download Original PDF" : "Unduh PDF Asli"}</span>
                                  </a>
                                ) : (
                                  <span className="text-xs text-[#666666] italic">{isEn ? "Drive link unavailable" : "Link Drive belum tersedia"}</span>
                                )}
                              </div>

                              {/* Jika Sudah Selesai Direview, Tampilkan Tautan File Revisi Tersimpan */}
                              {activeReviewManuscript.status === "Selesai" && activeReviewManuscript.revisedFileUrl && (
                                <div className="mt-3 p-3.5 bg-[#ecfdf5] border border-[#10b981]/30 flex flex-wrap items-center justify-between gap-3">
                                  <div className="min-w-0">
                                    <p className="text-xs font-bold text-[#065f46] truncate">{activeReviewManuscript.revisedFileName}</p>
                                    <p className="text-[11px] text-[#047857]">{isEn ? "Completed revision file archived in Google Drive" : "Arsip file PDF hasil revisi di Google Drive"}</p>
                                  </div>
                                  <a
                                    href={activeReviewManuscript.revisedFileUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="px-3 py-1.5 bg-[#059669] hover:bg-[#047857] text-[#ffffff] text-xs font-bold flex items-center gap-1.5 shrink-0"
                                  >
                                    <DownloadIcon className="w-3.5 h-3.5" />
                                    <span>{isEn ? "Download Revised PDF" : "Unduh PDF Revisi"}</span>
                                  </a>
                                </div>
                              )}
                            </div>

                            <form onSubmit={handleCompleteReview} className="space-y-6">
                              <div>
                                <label className="block text-xs font-bold uppercase tracking-wider text-[#353535] mb-2">
                                  {isEn ? "1. Upload Reviewer's Revised PDF File (Max. 5 MB) *" : "1. Unggah File PDF Hasil Koreksi Reviewer (Maks. 5 MB) *"}
                                </label>
                                <input
                                  ref={revisedFileInputRef}
                                  type="file"
                                  accept=".pdf,application/pdf"
                                  disabled={isCompletingReview}
                                  onChange={handleRevisedPdfSelect}
                                  className="w-full px-3 py-2.5 bg-[#f9f9f9] border border-[#e1e1e1] text-xs"
                                />
                                {revisedPdfFile && (
                                  <p className="text-[11px] font-semibold text-[#004b8e] mt-1">
                                    ✓ {revisedPdfFile.name} ({(revisedPdfFile.size / (1024 * 1024)).toFixed(2)} MB)
                                  </p>
                                )}
                                <p className="text-[11px] text-[#666666] mt-1 break-all">
                                  {isEn
                                    ? `This file will be automatically attached to the author's email (${activeReviewManuscript.authorEmail}).`
                                    : `File ini akan otomatis dilampirkan ke email penulis (${activeReviewManuscript.authorEmail}).`}
                                </p>
                              </div>

                              <div>
                                <label className="block text-xs font-bold uppercase tracking-wider text-[#353535] mb-2">{isEn ? "2. General Notes & Correction Summary" : "2. Catatan Umum & Ringkasan Koreksi"}</label>
                                <textarea
                                  rows="3"
                                  disabled={isCompletingReview}
                                  value={reviewNotesInput}
                                  onChange={(e) => setReviewNotesInput(e.target.value)}
                                  placeholder={isEn ? "Write key revision points on methodology, language, or formatting..." : "Tuliskan poin utama perbaikan metodologi, bahasa, atau format penulisan..."}
                                  className="w-full px-4 py-3 bg-[#f9f9f9] border border-[#e1e1e1] focus:border-[#004b8e] outline-none text-sm"
                                />
                              </div>

                              <div className="space-y-3">
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                  <label className="block text-xs font-bold uppercase tracking-wider text-[#353535]">{isEn ? "3. Recommended Journal Websites List" : "3. Daftar Website Jurnal Rekomendasi"}</label>
                                  <button
                                    type="button"
                                    disabled={isCompletingReview}
                                    onClick={handleAddJournalRow}
                                    className="px-3 py-1.5 bg-[#0693e3] hover:bg-[#004b8e] text-[#ffffff] text-xs font-bold flex items-center gap-1 cursor-pointer"
                                  >
                                    <PlusIcon className="w-3.5 h-3.5" />
                                    <span>{isEn ? "Add Journal" : "Tambah Jurnal"}</span>
                                  </button>
                                </div>

                                {journalListInput.map((journal, idx) => (
                                  <div key={idx} className="p-4 bg-[#f4f8fc] border border-[#004b8e]/20 space-y-3">
                                    <div className="flex items-center justify-between">
                                      <span className="text-xs font-bold text-[#004b8e]">{isEn ? `Journal Recommendation #${idx + 1}` : `Rekomendasi Jurnal #${idx + 1}`}</span>
                                      {journalListInput.length > 1 && (
                                        <button type="button" onClick={() => handleRemoveJournalRow(idx)} className="text-[#f2552c] hover:underline text-xs flex items-center gap-1 cursor-pointer">
                                          <TrashIcon className="w-3.5 h-3.5" />
                                          <span>{isEn ? "Remove" : "Hapus"}</span>
                                        </button>
                                      )}
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                      <input
                                        type="text"
                                        disabled={isCompletingReview}
                                        placeholder={isEn ? "Target Journal Name" : "Nama Jurnal Tujuan"}
                                        value={journal.name}
                                        onChange={(e) => handleUpdateJournalRow(idx, "name", e.target.value)}
                                        className="sm:col-span-2 px-3 py-2 bg-[#ffffff] border border-[#e1e1e1] text-xs"
                                      />

                                      <select
                                        disabled={isCompletingReview}
                                        value={journal.index}
                                        onChange={(e) => handleUpdateJournalRow(idx, "index", e.target.value)}
                                        aria-label={isEn ? "Select Journal Index" : "Pilih Indeks Jurnal"}
                                        className="px-3 py-2 bg-[#ffffff] border border-[#004b8e]/40 focus:border-[#004b8e] text-xs font-bold text-[#004b8e] outline-none cursor-pointer"
                                      >
                                        {JOURNAL_INDEX_OPTIONS.map((opt) => (
                                          <option key={opt} value={opt}>
                                            {opt}
                                          </option>
                                        ))}
                                      </select>
                                    </div>

                                    <input
                                      type="url"
                                      disabled={isCompletingReview}
                                      placeholder="https://link-website-jurnal.ac.id"
                                      value={journal.url}
                                      onChange={(e) => handleUpdateJournalRow(idx, "url", e.target.value)}
                                      className="w-full px-3 py-2 bg-[#ffffff] border border-[#e1e1e1] text-xs"
                                    />

                                    <input
                                      type="text"
                                      disabled={isCompletingReview}
                                      placeholder={isEn ? "Reason for suitability with the manuscript..." : "Alasan kecocokan dengan manuskrip..."}
                                      value={journal.reason}
                                      onChange={(e) => handleUpdateJournalRow(idx, "reason", e.target.value)}
                                      className="w-full px-3 py-2 bg-[#ffffff] border border-[#e1e1e1] text-xs"
                                    />
                                  </div>
                                ))}
                              </div>

                              <button
                                type="submit"
                                disabled={isCompletingReview}
                                className="w-full py-3.5 sm:py-4 bg-[#004b8e] hover:bg-[#0693e3] disabled:bg-[#64748b] text-[#ffffff] font-display font-bold text-xs sm:text-sm uppercase tracking-wider transition-colors flex items-center justify-center gap-2 cursor-pointer disabled:cursor-wait"
                              >
                                <MailIcon className="w-4 h-4" />
                                <span>
                                  {isCompletingReview
                                    ? isEn
                                      ? "Uploading Revised PDF & Sending Emails..."
                                      : "Mengunggah PDF Revisi & Mengirim Email..."
                                    : isEn
                                      ? "Send Revised File & Recommendations to Author Email"
                                      : "Kirim File Revisi & Rekomendasi ke Email Penulis"}
                                </span>
                              </button>
                            </form>
                          </div>
                        )}
                      </div>
                    </div>
                  </main>
                );
              })()}

            {/* =====================================================================
              FOOTER (z-50 agar tampil di atas seluruh lapisan stacking)
             ===================================================================== */}
            <footer className="relative z-50 bg-[#004b8e] text-[#ffffff] border-t border-[#0693e3]/40 py-6 sm:py-8">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-[#e2e8f0] text-center sm:text-left">
                <span>© 2026 Clinic Manuscripts FPIK Unpad • Powered by Torgas Blue Energy</span>
                <a href={`mailto:${CONTACT_EMAIL}`} className="text-[#38bdf8] hover:text-[#ffffff] hover:underline font-semibold break-all transition-colors">
                  {CONTACT_EMAIL}
                </a>
              </div>
            </footer>
          </div>
        );
      }

      // Render Aplikasi ke dalam div #root
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
